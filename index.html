<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Смены и подработки</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            padding-bottom: 80px;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 16px 16px;
            position: sticky;
            top: 0;
            z-index: 20;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
        }
        .header p {
            font-size: 13px;
            opacity: 0.85;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 12px 16px 16px;
        }
        .status {
            background: white;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 14px;
            font-size: 13px;
            color: #555;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            background: white;
            border-radius: 14px;
            padding: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .tab-btn {
            flex: 1;
            padding: 12px 8px;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            background: transparent;
            color: #888;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        .tab-btn:active {
            transform: scale(0.96);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* Карточка смены */
        .task-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            border-left: 4px solid #667eea;
        }
        .task-card .task-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .task-card .info {
            font-size: 14px;
            color: #666;
            margin: 3px 0;
        }
        .task-card .salary {
            font-size: 19px;
            font-weight: 700;
            color: #2e7d32;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #f0f0f0;
        }
        .task-card .meta {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        .task-card .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 6px;
        }
        .status-badge.pending {
            background: #fff3cd;
            color: #856404;
        }
        .status-badge.accepted {
            background: #d4edda;
            color: #155724;
        }
        .status-badge.rejected {
            background: #f8d7da;
            color: #721c24;
        }
        .status-badge.cancelled {
            background: #e2e3e5;
            color: #383d41;
        }

        /* Кнопки */
        .respond-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }
        .respond-btn:active {
            transform: scale(0.97);
        }
        .respond-btn:disabled {
            opacity: 0.6;
            cursor: default;
            transform: none;
        }
        .respond-btn.employer-btn {
            background: #ff6b35;
        }
        .respond-btn.accept-btn {
            background: #28a745;
        }
        .respond-btn.reject-btn {
            background: #dc3545;
        }
        .respond-btn.cancel-btn {
            background: #6c757d;
        }
        .respond-btn.small {
            padding: 8px 16px;
            font-size: 13px;
            width: auto;
            margin: 4px 4px 0 0;
            display: inline-block;
        }

        /* Форма */
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 16px;
            background: white;
            transition: border 0.2s;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
        }
        .submit-btn:active {
            transform: scale(0.97);
        }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Мои карточки */
        .my-card {
            background: white;
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border-left: 4px solid #4caf50;
        }
        .my-card .title {
            font-weight: 600;
            font-size: 16px;
        }
        .my-card .sub {
            font-size: 13px;
            color: #888;
        }
        .my-card .respondents {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #f0f0f0;
            font-size: 14px;
        }
        .my-card .actions {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 15px;
        }
        .empty .big-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .error {
            background: #fff5f5;
            color: #c62828;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #ffcdd2;
            font-size: 14px;
        }
        .text-center {
            text-align: center;
        }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .flex {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .flex-1 {
            flex: 1;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="container" style="padding: 0;">
            <h1>📋 Смены</h1>
            <p>Подработки и вакансии</p>
        </div>
    </div>

    <!-- MAIN -->
    <div class="container">

        <div id="status" class="status">⏳ Загрузка...</div>

        <!-- Табы -->
        <div class="tabs" id="tabNav">
            <button class="tab-btn active" data-tab="list">📋 Смены</button>
            <button class="tab-btn" data-tab="add">➕ Разместить</button>
            <button class="tab-btn" data-tab="my">👤 Мои</button>
        </div>

        <!-- Вкладка: Смены -->
        <div id="tab-list" class="tab-content active">
            <div id="tasks">
                <div class="text-center" style="padding:30px;">
                    <div class="spinner"></div>
                    <div style="margin-top:10px;color:#999;">Загрузка смен...</div>
                </div>
            </div>
        </div>

        <!-- Вкладка: Разместить -->
        <div id="tab-add" class="tab-content">
            <div style="background:white;padding:18px;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);">
                <h3 style="margin-bottom:16px;font-size:18px;">➕ Новая смена</h3>
                <div class="form-group">
                    <label>Профессия / Название *</label>
                    <input id="f-title" placeholder="Водитель, Курьер..." />
                </div>
                <div class="form-group">
                    <label>Место</label>
                    <input id="f-location" placeholder="Москва, СПб..." />
                </div>
                <div class="form-group">
                    <label>Дата</label>
                    <input id="f-date" type="date" />
                </div>
                <div class="form-group">
                    <label>Время</label>
                    <input id="f-time" placeholder="09:00-18:00" />
                </div>
                <div class="form-group">
                    <label>Оплата (₽)</label>
                    <input id="f-salary" type="number" placeholder="3000" />
                </div>
                <button class="submit-btn" id="submitBtn">✅ Разместить смену</button>
                <div id="addStatus" style="margin-top:12px;font-size:14px;color:#888;"></div>
            </div>
        </div>

        <!-- Вкладка: Мои -->
        <div id="tab-my" class="tab-content">
            <div id="myTasks">
                <div class="text-center" style="padding:30px;">
                    <div class="spinner"></div>
                    <div style="margin-top:10px;color:#999;">Загрузка...</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // 1. TELEGRAM — получаем ID пользователя
            // ============================================================
            var userId = 'test_user_' + Math.floor(Math.random() * 1000000);
            if (window.Telegram && window.Telegram.WebApp) {
                var tg = window.Telegram.WebApp;
                tg.ready();
                if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
                    userId = String(tg.initDataUnsafe.user.id);
                }
            }
            console.log('👤 Пользователь:', userId);

            // ============================================================
            // 2. SUPABASE
            // ============================================================
            var supabaseUrl = 'https://azxfbrmrnhckfbhghjqr.supabase.co';
            var supabaseKey = 'sb_publishable_WmfbkKQCW0ioUJA33Dgt0w_D6IJ5CQg';
            var supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

            // ============================================================
            // 3. ВКЛАДКИ
            // ============================================================
            var tabButtons = document.querySelectorAll('.tab-btn');
            var tabContents = {
                list: document.getElementById('tab-list'),
                add: document.getElementById('tab-add'),
                my: document.getElementById('tab-my')
            };

            tabButtons.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    tabButtons.forEach(function(b) { b.classList.remove('active'); });
                    this.classList.add('active');
                    var tabName = this.dataset.tab;
                    for (var key in tabContents) {
                        tabContents[key].classList.toggle('active', key === tabName);
                    }
                    if (tabName === 'my') {
                        loadMyTasks();
                    }
                });
            });

            // ============================================================
            // 4. ЗАГРУЗКА СПИСКА СМЕН
            // ============================================================
            async function loadTasks() {
                var container = document.getElementById('tasks');
                var status = document.getElementById('status');
                status.innerHTML = '⏳ Загрузка...';

                try {
                    var result = await supabase.from('tasks').select('*').order('id', { ascending: false });

                    if (result.error) {
                        container.innerHTML = '<div class="error">❌ ' + result.error.message + '</div>';
                        status.innerHTML = '❌ Ошибка';
                        return;
                    }

                    var data = result.data;
                    if (!data || data.length === 0) {
                        container.innerHTML = '<div class="empty"><div class="big-icon">📭</div>Смен пока нет</div>';
                        status.innerHTML = '✅ Смен нет';
                        return;
                    }

                    // Получаем отклики пользователя со статусами
                    var myResponses = {};
                    try {
                        var respResult = await supabase.from('responses')
                            .select('task_id, status')
                            .eq('user_id', userId);
                        if (respResult.data) {
                            respResult.data.forEach(function(r) {
                                myResponses[r.task_id] = r.status;
                            });
                        }
                    } catch (_) {}

                    var html = '';
                    for (var i = 0; i < data.length; i++) {
                        var task = data[i];
                        var isMyTask = (task.created_by === userId);
                        var myStatus = myResponses[task.id] || null;

                        var dateFormatted = task.date || 'Не указана';
                        if (task.date) {
                            try {
                                var d = new Date(task.date);
                                dateFormatted = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long',
                                    year: 'numeric' });
                            } catch (_) {}
                        }

                        // Кнопка в зависимости от статуса
                        var btnHtml = '';
                        if (isMyTask) {
                            btnHtml = '<button class="respond-btn employer-btn" disabled>📌 Моя смена</button>';
                        } else if (myStatus === 'pending') {
                            btnHtml = `
                                <button class="respond-btn" disabled>⏳ Ожидает рассмотрения</button>
                                <button class="respond-btn cancel-btn" data-id="${task.id}" data-action="cancel">Отменить отклик</button>
                            `;
                        } else if (myStatus === 'accepted') {
                            btnHtml = '<button class="respond-btn" style="background:#28a745;" disabled>✅ Вы приняты!</button>';
                        } else if (myStatus === 'rejected') {
                            btnHtml = '<button class="respond-btn" style="background:#dc3545;" disabled>❌ Отклонено</button>';
                        } else if (myStatus === 'cancelled') {
                            btnHtml = '<button class="respond-btn" style="background:#6c757d;" disabled>🚫 Отменено вами</button>';
                        } else {
                            btnHtml = '<button class="respond-btn" data-id="' + task.id + '" data-action="respond">Откликнуться</button>';
                        }

                        html += '<div class="task-card">' +
                            '<div class="task-title">' + (task.description || task.title || 'Без названия') +
                            '</div>' +
                            '<div class="info">📍 ' + (task.location || task.place || 'Не указано') + '</div>' +
                            '<div class="info">📅 ' + dateFormatted + '</div>' +
                            '<div class="info">⏰ ' + (task.time || 'Не указано') + '</div>' +
                            '<div class="salary">' + (task.salary ? task.salary + ' ₽' : 'Не указана') + '</div>' +
                            '<div class="meta">' + (isMyTask ? '👤 Размещено вами' : '') + '</div>' +
                            btnHtml +
                            '</div>';
                    }

                    container.innerHTML = html;

                    // Обработчики кнопок
                    document.querySelectorAll('.respond-btn[data-action="respond"]').forEach(function(btn) {
                        btn.addEventListener('click', respondToTask);
                    });

                    document.querySelectorAll('.respond-btn[data-action="cancel"]').forEach(function(btn) {
                        btn.addEventListener('click', cancelResponse);
                    });

                    status.innerHTML = '✅ Подключено. ' + data.length + ' смен';

                } catch (err) {
                    container.innerHTML = '<div class="error">❌ ' + err.message + '</div>';
                    status.innerHTML = '❌ Ошибка';
                }
            }

            // ============================================================
            // 5. ОТКЛИКНУТЬСЯ
            // ============================================================
            async function respondToTask() {
                var btn = this;
                var taskId = btn.dataset.id;
                var originalText = btn.textContent;

                btn.textContent = '⏳ Отправка...';
                btn.disabled = true;

                try {
                    // Проверяем, нет ли уже отклика
                    var check = await supabase.from('responses')
                        .select('*')
                        .eq('task_id', parseInt(taskId))
                        .eq('user_id', userId);

                    if (check.data && check.data.length > 0) {
                        alert('Вы уже откликались на эту смену!');
                        btn.textContent = '✅ Уже откликнулись';
                        btn.disabled = true;
                        return;
                    }

                    var insResult = await supabase.from('responses').insert([{
                        task_id: parseInt(taskId),
                        user_id: userId,
                        status: 'pending'
                    }]);

                    if (insResult.error) {
                        alert('❌ ' + insResult.error.message);
                        btn.textContent = originalText;
                        btn.disabled = false;
                    } else {
                        btn.textContent = '⏳ Ожидает рассмотрения';
                        btn.disabled = true;
                        if (window.Telegram && window.Telegram.WebApp) {
                            window.Telegram.WebApp.showAlert('✅ Вы откликнулись на смену! Ожидайте ответа.');
                        } else {
                            alert('✅ Отклик отправлен!');
                        }
                        loadTasks();
                    }
                } catch (err) {
                    alert('❌ ' + err.message);
                    btn.textContent = originalText;
                    btn.disabled = false;
                }
            }

            // ============================================================
            // 6. ОТМЕНА ОТКЛИКА
            // ============================================================
            async function cancelResponse() {
                var btn = this;
                var taskId = btn.dataset.id;

                if (!confirm('❓ Отменить отклик на эту смену?')) return;

                btn.textContent = '⏳ Отмена...';
                btn.disabled = true;

                try {
                    var result = await supabase.from('responses')
                        .update({ status: 'cancelled' })
                        .eq('task_id', parseInt(taskId))
                        .eq('user_id', userId);

                    if (result.error) {
                        alert('❌ ' + result.error.message);
                    } else {
                        if (window.Telegram && window.Telegram.WebApp) {
                            window.Telegram.WebApp.showAlert('✅ Отклик отменён');
                        } else {
                            alert('✅ Отклик отменён');
                        }
                        loadTasks();
                    }
                } catch (err) {
                    alert('❌ ' + err.message);
                }
                btn.textContent = 'Отменить отклик';
                btn.disabled = false;
            }

            // ============================================================
            // 7. ДОБАВЛЕНИЕ СМЕНЫ
            // ============================================================
            document.getElementById('submitBtn').addEventListener('click', async function() {
                var title = document.getElementById('f-title').value.trim();
                var location = document.getElementById('f-location').value.trim();
                var date = document.getElementById('f-date').value;
                var time = document.getElementById('f-time').value.trim();
                var salary = document.getElementById('f-salary').value.trim();
                var statusEl = document.getElementById('addStatus');

                if (!title) {
                    alert('❌ Введите название смены');
                    return;
                }

                this.textContent = '⏳ Отправка...';
                this.disabled = true;
                statusEl.textContent = '⏳ Отправка...';

                try {
                    var result = await supabase.from('tasks').insert([{
                        description: title,
                        location: location || null,
                        date: date || null,
                        time: time || null,
                        salary: parseInt(salary) || 0,
                        created_by: userId
                    }]);

                    if (result.error) {
                        statusEl.textContent = '❌ ' + result.error.message;
                        alert('❌ ' + result.error.message);
                    } else {
                        statusEl.textContent = '✅ Смена добавлена!';
                        if (window.Telegram && window.Telegram.WebApp) {
                            window.Telegram.WebApp.showAlert('✅ Смена успешно добавлена!');
                        } else {
                            alert('✅ Смена добавлена!');
                        }
                        document.querySelectorAll('#tab-add input').forEach(function(i) { i.value = ''; });
                        loadTasks();
                        document.querySelector('.tab-btn[data-tab="list"]').click();
                    }
                } catch (err) {
                    statusEl.textContent = '❌ ' + err.message;
                    alert('❌ ' + err.message);
                }

                this.textContent = '✅ Разместить смену';
                this.disabled = false;
            });

            // ============================================================
            // 8. МОИ: ОТКЛИКИ + МОИ СМЕНЫ (с управлением)
            // ============================================================
            async function loadMyTasks() {
                var container = document.getElementById('myTasks');

                try {
                    // 1. Мои смены (как работодатель)
                    var myTasksResult = await supabase.from('tasks').select('*').eq('created_by', userId);
                    var myTasks = myTasksResult.data || [];

                    // 2. Мои отклики (как работник)
                    var respResult = await supabase.from('responses')
                        .select('task_id, status')
                        .eq('user_id', userId);
                    var myResponseIds = respResult.data || [];

                    var respondedTasks = [];
                    if (myResponseIds.length > 0) {
                        var taskIds = myResponseIds.map(function(r) { return r.task_id; });
                        var tasksResult = await supabase.from('tasks').select('*').in('id', taskIds);
                        respondedTasks = tasksResult.data || [];
                    }

                    if (myTasks.length === 0 && respondedTasks.length === 0) {
                        container.innerHTML = '<div class="empty"><div class="big-icon">📭</div>У вас пока нет активности</div>';
                        return;
                    }

                    var html = '';

                    // ===== МОИ СМЕНЫ (работодатель) =====
                    if (myTasks.length > 0) {
                        html += '<h4 style="margin:12px 0 8px;color:#ff6b35;">📌 Мои смены</h4>';
                        for (var i = 0; i < myTasks.length; i++) {
                            var task = myTasks[i];

                            // Получаем отклики на эту смену
                            var respForTask = await supabase.from('responses')
                                .select('id, user_id, status')
                                .eq('task_id', task.id);
                            var applicants = respForTask.data || [];

                            var dateFormatted = task.date || 'Не указана';
                            if (task.date) {
                                try {
                                    var d = new Date(task.date);
                                    dateFormatted = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long',
                                        year: 'numeric' });
                                } catch (_) {}
                            }

                            html += '<div class="my-card" style="border-left-color:#ff6b35;">' +
                                '<div class="title">' + (task.description || task.title || 'Без названия') +
                                '</div>' +
                                '<div class="sub">📍 ' + (task.location || task.place || 'Не указано') + '</div>' +
                                '<div class="sub">📅 ' + dateFormatted + '</div>' +
                                '<div class="sub">💰 ' + (task.salary ? task.salary + ' ₽' : 'Не указана') +
                                '</div>';

                            // Список откликнувшихся
                            if (applicants.length > 0) {
                                html += '<div class="respondents"><strong>👥 Отклики:</strong>';
                                for (var a = 0; a < applicants.length; a++) {
                                    var app = applicants[a];
                                    var statusText = {
                                        'pending': '⏳ Ожидает',
                                        'accepted': '✅ Принят',
                                        'rejected': '❌ Отклонён',
                                        'cancelled': '🚫 Отменён'
                                    } [app.status] || app.status;

                                    html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #f5f5f5;">' +
                                        '<span>👤 ' + app.user_id + ' — ' + statusText + '</span>';

                                    // Кнопки для работодателя (только если статус pending)
                                    if (app.status === 'pending') {
                                        html += '<span>' +
                                            '<button class="respond-btn small accept-btn" data-response-id="' + app
                                            .id + '" data-action="accept">✅ Принять</button> ' +
                                            '<button class="respond-btn small reject-btn" data-response-id="' + app
                                            .id + '" data-action="reject">❌ Отклонить</button>' +
                                            '</span>';
                                    }
                                    html += '</div>';
                                }
                                html += '</div>';
                            } else {
                                html += '<div class="respondents" style="color:#999;">Пока никто не откликнулся</div>';
                            }

                            html += '</div>';
                        }
                    }

                    // ===== МОИ ОТКЛИКИ (работник) =====
                    if (respondedTasks.length > 0) {
                        html += '<h4 style="margin:12px 0 8px;color:#4caf50;">✅ Мои отклики</h4>';
                        for (var j = 0; j < respondedTasks.length; j++) {
                            var t = respondedTasks[j];
                            var statusText = {
                                'pending': '⏳ Ожидает рассмотрения',
                                'accepted': '✅ Принято!',
                                'rejected': '❌ Отклонено',
                                'cancelled': '🚫 Отменено вами'
                            } [myResponseIds[j]?.status] || '⏳ Ожидает';

                            var dateFormatted2 = t.date || 'Не указана';
                            if (t.date) {
                                try {
                                    var d2 = new Date(t.date);
                                    dateFormatted2 = d2.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long',
                                        year: 'numeric' });
                                } catch (_) {}
                            }

                            html += '<div class="my-card">' +
                                '<div class="title">' + (t.description || t.title || 'Без названия') +
                                '</div>' +
                                '<div class="sub">📍 ' + (t.location || t.place || 'Не указано') + '</div>' +
                                '<div class="sub">📅 ' + dateFormatted2 + '</div>' +
                                '<div class="sub">💰 ' + (t.salary ? t.salary + ' ₽' : 'Не указана') +
                                '</div>' +
                                '<div><span class="status-badge ' + (myResponseIds[j]?.status || 'pending') +
                                '">' + statusText + '</span></div>';

                            // Если статус pending — можно отменить
                            if (myResponseIds[j]?.status === 'pending') {
                                html += '<button class="respond-btn cancel-btn small" data-task-id="' + t.id +
                                    '" style="margin-top:8px;">🚫 Отменить отклик</button>';
                            }
                            html += '</div>';
                        }
                    }

                    container.innerHTML = html;

                    // ===== ОБРАБОТЧИКИ =====
                    // Принять/отклонить отклик (работодатель)
                    document.querySelectorAll('[data-action="accept"]').forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            handleEmployerResponse(this.dataset.responseId, 'accepted');
                        });
                    });
                    document.querySelectorAll('[data-action="reject"]').forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            handleEmployerResponse(this.dataset.responseId, 'rejected');
                        });
                    });

                    // Отменить отклик (работник)
                    document.querySelectorAll('[data-task-id]').forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            cancelResponseFromMy(this.dataset.taskId);
                        });
                    });

                } catch (err) {
                    container.innerHTML = '<div class="error">❌ ' + err.message + '</div>';
                }
            }

            // ============================================================
            // 9. ОТВЕТ РАБОТОДАТЕЛЯ (принять/отклонить)
            // ============================================================
            async function handleEmployerResponse(responseId, status) {
                if (!confirm('Подтвердите действие: ' + (status === 'accepted' ? 'ПРИНЯТЬ' : 'ОТКЛОНИТЬ') + ' работника?'))
                    return;

                try {
                    var result = await supabase.from('responses')
                        .update({
                            status: status,
                            employer_response: status,
                            responded_at: new Date().toISOString()
                        })
                        .eq('id', parseInt(responseId));

                    if (result.error) {
                        alert('❌ ' + result.error.message);
                    } else {
                        if (window.Telegram && window.Telegram.WebApp) {
                            window.Telegram.WebApp.showAlert('✅ Отклик ' + (status === 'accepted' ? 'принят' :
                                'отклонён'));
                        } else {
                            alert('✅ Отклик ' + (status === 'accepted' ? 'принят' : 'отклонён'));
                        }
                        loadMyTasks();
                        loadTasks();
                    }
                } catch (err) {
                    alert('❌ ' + err.message);
                }
            }

            // ============================================================
            // 10. ОТМЕНА ОТКЛИКА (из вкладки Мои)
            // ============================================================
            async function cancelResponseFromMy(taskId) {
                if (!confirm('❓ Отменить отклик на эту смену?')) return;

                try {
                    var result = await supabase.from('responses')
                        .update({ status: 'cancelled' })
                        .eq('task_id', parseInt(taskId))
                        .eq('user_id', userId);

                    if (result.error) {
                        alert('❌ ' + result.error.message);
                    } else {
                        if (window.Telegram && window.Telegram.WebApp) {
                            window.Telegram.WebApp.showAlert('✅ Отклик отменён');
                        } else {
                            alert('✅ Отклик отменён');
                        }
                        loadMyTasks();
                        loadTasks();
                    }
                } catch (err) {
                    alert('❌ ' + err.message);
                }
            }

            // ============================================================
            // 11. ЗАПУСК
            // ============================================================
            loadTasks();
        })();
    </script>

</body>
</html>
